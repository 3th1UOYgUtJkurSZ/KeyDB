# ============================================================================
# KeyDB-A（站点 A,例如 AWS)—— 跨云 active-replica 双主 之一
#
# 复制路径(A 作为副本拉取 B 的数据):
#   keydb-a ─replicaof 127.0.0.1:6390─▶ deploy-a(redis_gateway)
#     ─QUIC 隧道(mTLS)─▶ deploy-b(quic_proxy) ─dial─▶ keydb-b
# ============================================================================

bind 127.0.0.1
port 6379
protected-mode yes

# 双主:active-replica 隐含 replica-read-only no。必须写在 replicaof 之前。
active-replica yes

# 指向【本机 deploy-a 的 redis_gateway 入口】,由隧道送到对端 keydb-b。
replicaof 127.0.0.1 6390

# ---- 复制鉴权(推荐)。作为副本连入对端(keydb-b)时使用的账号 ----
# 对端 keydb-b 上需有同名 repl 用户与同一密码(见 keydb-b.conf)。
masteruser repl
masterauth <REPL_PASSWORD>

# 供对端(keydb-b)作为副本连入本机时使用的复制账号。
user repl on ><REPL_PASSWORD> ~* &* +@all
# default 用户:示例放开;生产请按需收紧或改用 requirepass / 细粒度 ACL。
# user default on nopass ~* &* +@all

# ---- 跨公网 WAN 调优:加大 backlog,降低抖动/断链触发全量同步(可能丢数据)的概率 ----
repl-backlog-size 256mb
repl-backlog-ttl 86400
repl-timeout 120

# 演示用:关闭持久化(生产按需开启 RDB/AOF)
save ""
appendonly no
