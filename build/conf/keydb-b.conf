# ============================================================================
# KeyDB-B（站点 B,例如 阿里云)—— 跨云 active-replica 双主 之二
#
# 复制路径(B 作为副本拉取 A 的数据):
#   keydb-b ─replicaof 127.0.0.1:6390─▶ deploy-b(redis_gateway)
#     ─QUIC 隧道(mTLS)─▶ deploy-a(quic_proxy) ─dial─▶ keydb-a
# ============================================================================

bind 127.0.0.1
port 6379
protected-mode yes

# 双主:active-replica 隐含 replica-read-only no。必须写在 replicaof 之前。
active-replica yes

# 指向【本机 deploy-b 的 redis_gateway 入口】,由隧道送到对端 keydb-a。
replicaof 127.0.0.1 6390

# ---- 复制鉴权(推荐)。作为副本连入对端(keydb-a)时使用的账号 ----
masteruser repl
masterauth <REPL_PASSWORD>

# 供对端(keydb-a)作为副本连入本机时使用的复制账号。
user repl on ><REPL_PASSWORD> ~* &* +@all
# user default on nopass ~* &* +@all

# ---- 跨公网 WAN 调优 ----
repl-backlog-size 256mb
repl-backlog-ttl 86400
repl-timeout 120

save ""
appendonly no
